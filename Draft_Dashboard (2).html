let drafted=JSON.parse(localStorage.getItem("fd_drafted")||"[]");
let timerSeconds=0,timerInterval=null,timerOn=false;
function info(){let n=drafted.length,r=Math.floor(n/12)+1,s=n%12,i=(r%2)?s:11-s;return {n,r,s,i}}
function save(){localStorage.setItem("fd_teams",JSON.stringify(teamNames));localStorage.setItem("fd_drafted",JSON.stringify(drafted))}
function draft(name){if(drafted.length<144&&!drafted.includes(name)){drafted.push(name);save();timerSeconds=0;pauseTimer();render()}}

function editTeams(){let s=prompt("Enter 12 team names separated by commas:",teamNames.join(", "));if(!s)return;let a=s.split(",").map(x=>x.trim()).filter(Boolean);if(a.length===12){teamNames=a;save();render()}else alert("Please enter exactly 12 names.")}

let q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;
